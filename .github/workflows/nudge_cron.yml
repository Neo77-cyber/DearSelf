
name: Scheduled Habit Jobs

on:
  schedule:
    # Times are UTC. Lagos is UTC+1.
    - cron: '30 5 * * *'  # 06:30 Lagos: close yesterday, record misses
    - cron: '0 6 * * *'   # 07:00 Lagos: morning reminder
    - cron: '0 12 * * *'  # 13:00 Lagos: afternoon reminder
    - cron: '0 19 * * *'  # 20:00 Lagos: night watch warning

  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        type: choice
        options:
          - close_day
          - morning_reminder
          - afternoon_reminder
          - night_watch

jobs:
  
  close-day:
    name: Close Day (record misses)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close_day') ||
      github.event.schedule == '30 5 * * *'
    steps:
      - name: Trigger close_day
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Maintenance-Key: ${{ secrets.MAINTENANCE_KEY }}" \
            "${{ secrets.APP_URL }}/maintenance_trigger/?task=close_day"


  morning-reminder:
    name: Morning Reminder
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'morning_reminder') ||
      github.event.schedule == '0 6 * * *'
    steps:
      - name: Trigger morning nudge
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Maintenance-Key: ${{ secrets.MAINTENANCE_KEY }}" \
            "${{ secrets.APP_URL }}/maintenance_trigger/?task=send_nudges"


  afternoon-reminder:
    name: Afternoon Reminder
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'afternoon_reminder') ||
      github.event.schedule == '0 12 * * *'
    steps:
      - name: Trigger afternoon nudge
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Maintenance-Key: ${{ secrets.MAINTENANCE_KEY }}" \
            "${{ secrets.APP_URL }}/maintenance_trigger/?task=send_nudges"


  night-watch:
    name: Night Watch
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'night_watch') ||
      github.event.schedule == '0 19 * * *'
    steps:
      - name: Trigger night watch
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Maintenance-Key: ${{ secrets.MAINTENANCE_KEY }}" \
            "${{ secrets.APP_URL }}/maintenance_trigger/?task=night_watch"